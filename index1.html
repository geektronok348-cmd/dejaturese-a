<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensaje para Linda</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#14121f;--bub:#e9e7ee;--ink:#1b1830;--acc:#b9a4ff;--muted:#9a95b5}
html{height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(circle at 30% 10%,#2a2150,var(--bg) 60%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid #ffffff22;text-align:center;font-size:14px;color:var(--muted)}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-start;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover}
.name{font-size:12px;color:var(--muted);margin-bottom:3px}
.b{background:var(--bub);color:var(--ink);padding:9px 13px;border-radius:4px 16px 16px 16px;max-width:260px;line-height:1.35;font-size:15px}
.b.pink{background:#ffe3ef}
.st{width:150px;border-radius:14px;display:block}
.me{align-self:flex-end;background:var(--acc);color:#1b1830;padding:9px 13px;border-radius:16px 4px 16px 16px;font-size:15px}
.dots{color:var(--muted);font-size:13px}
#opts{padding:12px 14px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #ffffff22}
button{font:inherit;font-size:15px;padding:12px;border-radius:12px;border:1px solid var(--acc);background:#ffffff10;color:#fff;cursor:pointer}
button:hover,button:focus-visible{background:var(--acc);color:#1b1830}
#start{margin:auto;text-align:center;padding:24px}
#start h1{font-size:22px;margin:0 0 8px}#start p{color:var(--muted);margin:0 0 20px}
</style></head><body><div id="app"><header>Mensajero · chat privado</header>
<div id="chat"><div id="start"><h1>Tienes 1 mensaje nuevo 💌</h1><p>Zen quiere hablar contigo, Linda.</p><button id="go">Abrir chat</button></div></div>
<div id="opts" hidden></div></div>

const chat=document.getElementById('chat'),opts=document.getElementById('opts');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function zen(content,kind){const r=document.createElement('div');r.className='row';
 const inner=kind==='img'?'<img class="st" src="'+content+'" alt="Zen">':'<div class="b '+(kind||'')+'"></div>';
 r.innerHTML='<img class="av" src="'+AV+'" alt=""><div><div class="name">Zen</div>'+inner+'</div>';
 if(kind!=='img')r.querySelector('.b').textContent=content;
 chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
async function say(list){for(const m of list){const d=document.createElement('div');d.className='dots';d.textContent='Zen está escribiendo…';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
 await sleep(m.w||1300);d.remove();zen(m.t,m.k)}}
function choices(list){opts.hidden=false;opts.innerHTML='';list.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{opts.hidden=true;const me=document.createElement('div');me.className='me';me.textContent=label;chat.appendChild(me);chat.scrollTop=chat.scrollHeight;fn()};opts.appendChild(b)})}
const end=()=>choices([['Volver a empezar',()=>{chat.innerHTML='';intro()}]]);
async function yes(){await say([{t:ANGRY,k:'img'},{t:'¿Qué...? ¡¿Wow, en serio?!'},{t:'¿De veras, de veras?'},{t:'¿No es bait?'},{t:'Gritaré de felicidad. 💜',k:'pink'},{t:WINK,k:'img'},{t:'Iker ya debe estar sonriendo como tonto. Dile "sí" en persona, que se muere de la emoción.'}]);end()}
async function no(){await say([{t:'Ah...'},{t:'Gracias por ser sincera. Eso también es de valientes.'},{t:'Iker lo va a respetar, y tu amistad le importa un montón.'},{t:'Gracias por la cena, Linda. 💜'}]);end()}
async function think(){await say([{t:'Say what? ...Okay, okay.'},{t:'¿Te preocupa algo? Puedes decírselo, claro que te va a escuchar.'},{t:'Pero por ahora...'},{t:'¿podemos esperar?'},{t:'Tómate tu tiempo. Iker esperará. Y yo también. 💜',k:'pink'}]);end()}
async function intro(){
 await say([
 {t:'Hola, Linda. Soy Zen. Tengo un mensaje de parte de alguien.'},
 {t:'¿Te acuerdas del juego tontito que Iker te hizo en marzo?'},
 {t:'Era su forma de decirte que le gustas. Pero se quedó corto.'},
 {t:WINK,k:'img'},
 {t:'Lleva planeando esto desde septiembre. Sí, septiembre.'},
 {t:'Dice que le encanta cuando le llegan tus notificaciones.'},
 {t:'Y que solo espera el día para verte.'},
 {t:'Así que... Linda, ¿quieres ser la pareja de Iker?',k:'pink',w:1800}]);
 choices([['Sí 💜',yes],['No',no],['Lo voy a pensar',think]])}
document.getElementById('go').onclick=()=>{chat.innerHTML='';intro()};
</script></body></html>
